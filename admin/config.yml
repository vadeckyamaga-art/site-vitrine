# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: vadeckyamaga-art/site-vitrine
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/31c0fc67-5169-4a62-ba7a-11b5959fd1b1/pkce
  auth_token_endpoint: /sites/31c0fc67-5169-4a62-ba7a-11b5959fd1b1/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://sylviedjoyap.netlify.app

media_folder: "asset/images/uploads"
public_folder: "asset/images/uploads"

locale: "fr"

collections:
  - name: "products"
    label: "Produits"
    files:
      - file: "asset/data/products.json"
        label: "Catalogue produits"
        name: "products"
        fields:
          - label: "Produits"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.brand}}"
            fields:
              - label: "Identifiant unique"
                name: "id"
                widget: "string"
                hint: "Sans espace ni accent, ex : odalya-savon-molato"
              - label: "Nom du produit"
                name: "name"
                widget: "string"
              - label: "Marque"
                name: "brand"
                widget: "select"
                options: ["O'dalyaCosmetic", "Univers des Femmes"]
              - label: "Prix actuel (FCFA)"
                name: "price"
                widget: "number"
                value_type: "int"
              - label: "Ancien prix (FCFA)"
                name: "oldPrice"
                widget: "number"
                value_type: "int"
                required: false
                hint: "Laisser vide si le produit n'est pas en promotion"
              - label: "Image du produit"
                name: "image"
                widget: "image"
              - label: "En promotion ?"
                name: "promotion"
                widget: "boolean"
                default: false
              - label: "Meilleure vente ?"
                name: "bestseller"
                widget: "boolean"
                default: false
